name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version
      - name: Package tests
        run: swift test
      - name: CLI and plugin consumer
        run: bash Tests/CLI/smoke.sh
      - name: OpenAPI generated consumer
        run: bash Tests/OpenAPI/smoke.sh
      - name: Named-model generated consumers
        run: bash Tests/NamedModels/smoke.sh
      - name: Named-model entry points
        run: bash Tests/NamedModels/entry-points.sh
      - name: Official meta-schema consumer
        run: bash Tests/MetaSchema/smoke.sh
